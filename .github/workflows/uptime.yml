# External uptime check for jurma.site, running OUTSIDE the home server
# (the server's own monitoring cannot report a full outage of itself).
#
# Every 5 minutes (GitHub cron is best-effort, runs may be delayed or skipped):
#   1. https://jurma.site/                     -> HTTP 200 (Cloudflare + nginx + Next.js)
#   2. https://jurma.site/api/public/hero-status -> HTTP 200 JSON (web + database), and
#      checked_at younger than 10 minutes        -> the monitoring worker is still running
# A failure is retried 3 times over ~1 minute before alerting, to avoid false alarms.
# Alert: Telegram (secrets TG_TOKEN + TG_CHAT) and GitHub's own "workflow failed" email.
# Recovery: one "back up" Telegram message on the first green run after a red one.
name: uptime

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '17 6 1 * *'   # monthly keepalive (GitHub disables schedules after 60 days without activity)
  workflow_dispatch:
  push:   # TEMP for alert test

permissions:
  actions: write   # keepalive + reading the previous run's result

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check jurma.site
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -u
          tg() {
            [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || { echo "no Telegram secrets, skipping"; return 0; }
            curl -s -o /dev/null --max-time 15 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=$1" || true
          }

          if [ "$SCHEDULE" = "17 6 1 * *" ]; then
            gh api -X PUT "repos/$REPO/actions/workflows/uptime.yml/enable" && echo "keepalive ok"
          fi

          check() {
            local code body age
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -A 'jurma-uptime-external' https://jurma.site/)
            [ "$code" = 200 ] || { echo "homepage HTTP $code"; return 1; }
            body=$(curl -s --max-time 20 -A 'jurma-uptime-external' -w '\n%{http_code}' https://jurma.site/api/public/hero-status)
            code=${body##*$'\n'}; body=${body%$'\n'*}
            [ "$code" = 200 ] || { echo "hero-status HTTP $code"; return 1; }
            age=$(echo "$body" | python3 -c 'import sys,json,datetime as d
          t=json.load(sys.stdin)["checked_at"].replace("Z","+00:00")
          print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(t)).total_seconds()))' 2>/dev/null) \
              || { echo "hero-status: invalid JSON"; return 1; }
            [ "$age" -lt 600 ] || { echo "worker stale: last check ${age}s ago"; return 1; }
            echo "ok (last worker check ${age}s ago)"
          }

          prev=$(gh run list -R "$REPO" -w uptime.yml -s completed -L 1 --json conclusion -q '.[0].conclusion' 2>/dev/null || echo unknown)

          for i in 1 2 3; do
            if reason=$(check); then
              echo "$reason"
              [ "$prev" = failure ] && tg "jurma.site is back UP ($(date -u '+%H:%M UTC')) - external check"
              exit 0
            fi
            echo "attempt $i failed: $reason"; [ $i -lt 3 ] && sleep 25
          done

          # Telegram only on the first red run (no message every 5 minutes); GitHub emails every failure.
          [ "$prev" = failure ] || tg "jurma.site DOWN ($(date -u '+%H:%M UTC')) - external check from GitHub: $reason
          https://github.com/$REPO/actions"
          exit 1
